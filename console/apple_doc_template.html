<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.47059;
            letter-spacing: -0.022em;
            color: #1d1d1f;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Hero Header */
        .hero {
            padding: 90px 0 60px;
            background: #f5f5f7;
            text-align: center;
        }
        
        .hero-content {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 22px;
        }
        
        .eyebrow {
            font-size: 14px;
            font-weight: 600;
            color: #0071e3;
            margin-bottom: 8px;
        }
        
        .hero h1 {
            font-size: 48px;
            font-weight: 600;
            line-height: 1.0625;
            letter-spacing: -0.015em;
            margin-bottom: 12px;
        }
        
        .hero .subtitle {
            font-size: 21px;
            color: #86868b;
            max-width: 600px;
            margin: 0 auto 20px;
        }
        
        .meta-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding-top: 30px;
            border-top: 1px solid #d2d2d7;
        }
        
        .meta-item {
            font-size: 14px;
            color: #86868b;
        }
        
        .meta-item strong {
            color: #1d1d1f;
        }
        
        /* Navigation */
        nav {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.8);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        .nav-content {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 22px;
            display: flex;
            gap: 32px;
            overflow-x: auto;
        }
        
        .nav-content a {
            padding: 16px 0;
            font-size: 12px;
            color: #1d1d1f;
            text-decoration: none;
            white-space: nowrap;
            opacity: 0.8;
            border-bottom: 2px solid transparent;
        }
        
        .nav-content a:hover { opacity: 1; }
        .nav-content a.active { border-bottom-color: #0071e3; opacity: 1; }
        
        /* Main Content */
        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 60px 22px 100px;
        }
        
        h2 {
            font-size: 32px;
            font-weight: 600;
            margin: 60px 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #d2d2d7;
        }
        
        h3 {
            font-size: 21px;
            font-weight: 600;
            margin: 40px 0 14px;
        }
        
        h4 {
            font-size: 17px;
            font-weight: 600;
            margin: 28px 0 10px;
        }
        
        p {
            margin: 12px 0;
            color: #1d1d1f;
        }
        
        ul, ol {
            margin: 12px 0;
            padding-left: 24px;
        }
        
        li { margin: 8px 0; }
        
        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }
        
        th, td {
            border: 1px solid #d2d2d7;
            padding: 12px 14px;
            text-align: left;
        }
        
        th {
            background: #f5f5f7;
            font-weight: 600;
        }
        
        tr:nth-child(even) { background: #fbfbfd; }
        
        /* Code */
        code {
            font-family: 'SF Mono', SFMono-Regular, Consolas, monospace;
            font-size: 13px;
            background: #f5f5f7;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        pre {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 20px 24px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        
        pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        
        /* Blockquote */
        blockquote {
            border-left: 4px solid #0071e3;
            padding: 16px 20px;
            margin: 20px 0;
            background: #f5f5f7;
            border-radius: 0 12px 12px 0;
        }
        
        /* Link */
        a {
            color: #0071e3;
            text-decoration: none;
        }
        
        a:hover { text-decoration: underline; }
        
        hr {
            border: none;
            border-top: 1px solid #d2d2d7;
            margin: 40px 0;
        }
        
        strong { font-weight: 600; }
        
        /* Footer */
        footer {
            padding: 30px 22px;
            border-top: 1px solid #d2d2d7;
            text-align: center;
            font-size: 12px;
            color: #86868b;
        }
        
        footer a { color: #0071e3; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .hero .subtitle { font-size: 17px; }
            .meta-row { flex-wrap: wrap; gap: 16px; }
            h2 { font-size: 24px; }
            h3 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <p class="eyebrow">技术文档</p>
            <h1>{{title}}</h1>
            <p class="subtitle">{{description}}</p>
            <div class="meta-row">
                <span class="meta-item">版本：<strong>{{version}}</strong></span>
                <span class="meta-item">更新：<strong>{{date}}</strong></span>
                <span class="meta-item">SFT-001</span>
            </div>
        </div>
    </section>
    
    <nav>
        <div class="nav-content">
            <a href="#top">概述</a>
        </div>
    </nav>
    
    <main>
{{content}}
    </main>
    
    <footer>
        <p>SFT-001 智能鱼缸 · <a href="../../index.html">返回文档中心</a></p>
    </footer>
</body>
</html>
